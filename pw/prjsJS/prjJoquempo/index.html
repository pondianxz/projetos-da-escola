            <div class="divStats">

                    <h4>Rodadas: <span id="statsTxRodadas">0</span></h4>
                    <h4>Vitórias: <span id="statsTxVitorias">0</span></h4>
                    <h4>Derrotas: <span id="statsTxDerrotas">0</span></h4>    
                </div>
                
                <button id="btnResetStats">Resetar</button>
            </div>
            
        </section>
    </div>

</body>
</html>
